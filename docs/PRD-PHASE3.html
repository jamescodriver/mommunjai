  const MD = "# PRD \u2014 Mommunjai Phase 3: CRM & Base Reactivation\n\n> \u0e40\u0e27\u0e2d\u0e23\u0e4c\u0e0a\u0e31\u0e19 **3.1** \u00b7 2026-07-26 \u00b7 PM/BA/SA (Angiris) \u00b7 \u0e2a\u0e16\u0e32\u0e19\u0e30: **Spec \u2014 \u0e23\u0e2d\u0e2d\u0e19\u0e38\u0e21\u0e31\u0e15\u0e34\u0e01\u0e48\u0e2d\u0e19\u0e2a\u0e23\u0e49\u0e32\u0e07**\n> **\u0e41\u0e01\u0e49\u0e44\u0e02 3.1:** \u0e10\u0e32\u0e19\u0e08\u0e23\u0e34\u0e07 = **150,000 \u0e04\u0e19** \u2192 \u0e40\u0e1e\u0e34\u0e48\u0e21 \u00a71.5 \u0e1a\u0e31\u0e19\u0e44\u0e14\u0e01\u0e32\u0e23\u0e40\u0e02\u0e49\u0e32\u0e16\u0e36\u0e07 \u00b7 \u0e40\u0e1e\u0e34\u0e48\u0e21 F0 \u0e40\u0e1e\u0e14\u0e32\u0e19\u0e1a\u0e31\u0e07\u0e04\u0e31\u0e1a\u0e14\u0e49\u0e27\u0e22\u0e42\u0e04\u0e49\u0e14 \u00b7 \u0e15\u0e31\u0e14\u0e41\u0e1c\u0e19\u0e22\u0e34\u0e07 broadcast \u0e40\u0e2b\u0e21\u0e32\u0e23\u0e27\u0e21\u0e2d\u0e2d\u0e01 \u00b7 \u0e40\u0e1e\u0e34\u0e48\u0e21\u0e40\u0e1f\u0e2a P0-c \u00b7 \u0e40\u0e1e\u0e34\u0e48\u0e21\u0e2b\u0e19\u0e49\u0e32\u0e08\u0e2d S14\n> \u0e15\u0e48\u0e2d\u0e22\u0e2d\u0e14\u0e08\u0e32\u0e01 [PRD.md](PRD.md) (\u0e40\u0e1f\u0e2a 1) + [PRD-PHASE2.md](PRD-PHASE2.md) (\u0e40\u0e1f\u0e2a 2)\n> HTML: [PRD-PHASE3.html](PRD-PHASE3.html) \u00b7 **\u0e2b\u0e19\u0e49\u0e32\u0e08\u0e2d+\u0e42\u0e1f\u0e25\u0e27\u0e4c:** `crm-flow-65641ac5.html`\n> \u0e2a\u0e16\u0e32\u0e1b\u0e31\u0e15\u0e22\u0e4c: [ARCHITECTURE.md](ARCHITECTURE.md) \u00b7 \u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25: [DATA-MODEL.md](DATA-MODEL.md) + migration **0003**\n\n## \u0e2a\u0e32\u0e23\u0e1a\u0e31\u0e0d\n- [0. \u0e20\u0e32\u0e1e\u0e23\u0e27\u0e21 + \u0e17\u0e33\u0e44\u0e21\u0e15\u0e49\u0e2d\u0e07\u0e21\u0e35\u0e40\u0e1f\u0e2a 3](#0-\u0e20\u0e32\u0e1e\u0e23\u0e27\u0e21)\n- [1. \u0e02\u0e49\u0e2d\u0e40\u0e17\u0e47\u0e08\u0e08\u0e23\u0e34\u0e07 LINE \u0e17\u0e35\u0e48\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19\u0e41\u0e25\u0e49\u0e27 (\u0e10\u0e32\u0e19\u0e02\u0e2d\u0e07\u0e2a\u0e40\u0e1b\u0e01\u0e17\u0e31\u0e49\u0e07\u0e09\u0e1a\u0e31\u0e1a)](#1-\u0e02\u0e49\u0e2d\u0e40\u0e17\u0e47\u0e08\u0e08\u0e23\u0e34\u0e07-line)\n- [**1.5 \u0e1a\u0e31\u0e19\u0e44\u0e14\u0e01\u0e32\u0e23\u0e40\u0e02\u0e49\u0e32\u0e16\u0e36\u0e07 \u2014 \u0e10\u0e32\u0e19 150,000 \u0e04\u0e19** \ud83c\udd95](#15-\u0e1a\u0e31\u0e19\u0e44\u0e14\u0e01\u0e32\u0e23\u0e40\u0e02\u0e49\u0e32\u0e16\u0e36\u0e07)\n- [2. Epic D \u2014 Identity Resolution (\u0e40\u0e1b\u0e25\u0e35\u0e48\u0e22\u0e19\u0e04\u0e19\u0e19\u0e34\u0e23\u0e19\u0e32\u0e21 \u2192 \u0e25\u0e39\u0e01\u0e04\u0e49\u0e32\u0e17\u0e35\u0e48\u0e23\u0e39\u0e49\u0e08\u0e31\u0e01)](#2-epic-d)\n- [3. Epic E \u2014 Customer 360 (\u0e41\u0e01\u0e19 CRM)](#3-epic-e)\n- [4. Epic F \u2014 Segment \u2192 Audience \u2192 Campaign](#4-epic-f)\n- [5. Epic G \u2014 Lifecycle Automation](#5-epic-g)\n- [6. Data Model (migration 0003)](#6-data-model)\n- [7. API Surface](#7-api-surface)\n- [8. \u0e2b\u0e19\u0e49\u0e32\u0e08\u0e2d\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14\u0e02\u0e2d\u0e07\u0e40\u0e1f\u0e2a 3](#8-\u0e2b\u0e19\u0e49\u0e32\u0e08\u0e2d)\n- [9. NFR \u00b7 \u0e04\u0e27\u0e32\u0e21\u0e1b\u0e25\u0e2d\u0e14\u0e20\u0e31\u0e22 \u00b7 PDPA](#9-nfr)\n- [10. \u0e15\u0e49\u0e19\u0e17\u0e38\u0e19\u0e02\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21 + Guardrail](#10-\u0e15\u0e49\u0e19\u0e17\u0e38\u0e19)\n- [11. \u0e15\u0e31\u0e27\u0e27\u0e31\u0e14\u0e1c\u0e25 (KPI)](#11-kpi)\n- [12. Phasing + Definition of Done](#12-phasing)\n- [13. Open Questions](#13-open-questions)\n- [14. \u0e04\u0e27\u0e32\u0e21\u0e40\u0e2a\u0e35\u0e48\u0e22\u0e07 (Red-team)](#14-\u0e04\u0e27\u0e32\u0e21\u0e40\u0e2a\u0e35\u0e48\u0e22\u0e07)\n\n---\n\n## 0. \u0e20\u0e32\u0e1e\u0e23\u0e27\u0e21\n\u0e40\u0e1f\u0e2a 1\u20132 \u0e2a\u0e23\u0e49\u0e32\u0e07 \"\u0e17\u0e48\u0e2d\u0e23\u0e31\u0e1a lead \u0e43\u0e2b\u0e21\u0e48\" \u0e44\u0e14\u0e49\u0e41\u0e25\u0e49\u0e27 **\u0e40\u0e1f\u0e2a 3 \u0e04\u0e37\u0e2d\u0e01\u0e32\u0e23\u0e40\u0e1b\u0e25\u0e35\u0e48\u0e22\u0e19 LINE OA \u0e40\u0e14\u0e34\u0e21\u0e17\u0e35\u0e48\u0e21\u0e35\u0e10\u0e32\u0e19\u0e25\u0e39\u0e01\u0e04\u0e49\u0e32\u0e2d\u0e22\u0e39\u0e48\u0e41\u0e25\u0e49\u0e27 \u0e43\u0e2b\u0e49\u0e01\u0e25\u0e32\u0e22\u0e40\u0e1b\u0e47\u0e19 CRM (\u0e23\u0e30\u0e1a\u0e1a\u0e1a\u0e23\u0e34\u0e2b\u0e32\u0e23\u0e04\u0e27\u0e32\u0e21\u0e2a\u0e31\u0e21\u0e1e\u0e31\u0e19\u0e18\u0e4c\u0e25\u0e39\u0e01\u0e04\u0e49\u0e32) \u0e17\u0e35\u0e48\u0e43\u0e0a\u0e49\u0e07\u0e32\u0e19\u0e44\u0e14\u0e49\u0e08\u0e23\u0e34\u0e07**\n\n### \ud83d\udccf \u0e02\u0e19\u0e32\u0e14\u0e10\u0e32\u0e19\u0e08\u0e23\u0e34\u0e07: **150,000 \u0e04\u0e19** (\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19 2026-07-26)\n\u0e15\u0e31\u0e27\u0e40\u0e25\u0e02\u0e19\u0e35\u0e49**\u0e40\u0e1b\u0e25\u0e35\u0e48\u0e22\u0e19\u0e2a\u0e21\u0e01\u0e32\u0e23\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14** \u0e41\u0e25\u0e30\u0e40\u0e1b\u0e47\u0e19\u0e40\u0e2b\u0e15\u0e38\u0e1c\u0e25\u0e17\u0e35\u0e48\u0e2a\u0e40\u0e1b\u0e01\u0e09\u0e1a\u0e31\u0e1a\u0e19\u0e35\u0e49\u0e41\u0e01\u0e49\u0e44\u0e02\u0e04\u0e23\u0e31\u0e49\u0e07\u0e17\u0e35\u0e48 2:\n- \u0e22\u0e34\u0e07 broadcast \u0e16\u0e36\u0e07\u0e17\u0e38\u0e01\u0e04\u0e19 **1 \u0e04\u0e23\u0e31\u0e49\u0e07 = 150,000 \u0e02\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21** \u2192 \u0e04\u0e48\u0e32\u0e43\u0e0a\u0e49\u0e08\u0e48\u0e32\u0e22\u0e23\u0e30\u0e14\u0e31\u0e1a\u0e2b\u0e25\u0e31\u0e01\u0e2b\u0e21\u0e37\u0e48\u0e19\u0e1a\u0e32\u0e17\u0e15\u0e48\u0e2d\u0e04\u0e23\u0e31\u0e49\u0e07 (\u0e14\u0e39 \u00a710)\n- \u0e10\u0e32\u0e19\u0e2a\u0e30\u0e2a\u0e21\u0e21\u0e32\u0e19\u0e32\u0e19 \u0e04\u0e19\u0e08\u0e33\u0e19\u0e27\u0e19\u0e21\u0e32\u0e01**\u0e44\u0e21\u0e48\u0e44\u0e14\u0e49\u0e2d\u0e22\u0e39\u0e48\u0e43\u0e19\u0e0a\u0e48\u0e27\u0e07\u0e40\u0e15\u0e23\u0e35\u0e22\u0e21\u0e17\u0e49\u0e2d\u0e07\u0e41\u0e25\u0e49\u0e27** \u2192 \u0e22\u0e34\u0e07\u0e40\u0e2b\u0e21\u0e32\u0e23\u0e27\u0e21\u0e04\u0e37\u0e2d\u0e08\u0e48\u0e32\u0e22\u0e40\u0e07\u0e34\u0e19\u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e43\u0e2b\u0e49\u0e04\u0e19\u0e23\u0e33\u0e04\u0e32\u0e0d\n- \u0e2d\u0e31\u0e15\u0e23\u0e32\u0e1a\u0e25\u0e47\u0e2d\u0e01\u0e41\u0e04\u0e48 1% \u0e02\u0e2d\u0e07 150,000 = **\u0e40\u0e2a\u0e35\u0e22\u0e1c\u0e39\u0e49\u0e15\u0e34\u0e14\u0e15\u0e32\u0e21 1,500 \u0e04\u0e19\u0e16\u0e32\u0e27\u0e23** (LINE \u0e44\u0e21\u0e48\u0e04\u0e37\u0e19\u0e43\u0e2b\u0e49)\n\n> **\u0e2b\u0e25\u0e31\u0e01\u0e01\u0e32\u0e23\u0e43\u0e2b\u0e21\u0e48\u0e17\u0e35\u0e48\u0e04\u0e38\u0e21\u0e17\u0e31\u0e49\u0e07\u0e40\u0e1f\u0e2a 3:**\n> ## \ud83d\udeab \u0e44\u0e21\u0e48\u0e22\u0e34\u0e07\u0e2b\u0e32\u0e17\u0e38\u0e01\u0e04\u0e19 \u2014 \u0e43\u0e0a\u0e49\u0e0a\u0e48\u0e2d\u0e07\u0e17\u0e32\u0e07\u0e1f\u0e23\u0e35\u0e43\u0e2b\u0e49\u0e2b\u0e21\u0e14\u0e01\u0e48\u0e2d\u0e19 \u0e41\u0e25\u0e49\u0e27\u0e04\u0e48\u0e2d\u0e22\u0e08\u0e48\u0e32\u0e22\u0e40\u0e07\u0e34\u0e19\u0e40\u0e09\u0e1e\u0e32\u0e30\u0e01\u0e25\u0e38\u0e48\u0e21\u0e40\u0e25\u0e47\u0e01\u0e17\u0e35\u0e48\u0e04\u0e31\u0e14\u0e21\u0e32\u0e41\u0e25\u0e49\u0e27\n> \u0e23\u0e30\u0e1a\u0e1a\u0e08\u0e30**\u0e1a\u0e25\u0e47\u0e2d\u0e01\u0e01\u0e32\u0e23\u0e22\u0e34\u0e07\u0e40\u0e01\u0e34\u0e19\u0e40\u0e1e\u0e14\u0e32\u0e19\u0e14\u0e49\u0e27\u0e22\u0e42\u0e04\u0e49\u0e14** \u0e44\u0e21\u0e48\u0e43\u0e0a\u0e48\u0e41\u0e04\u0e48\u0e40\u0e02\u0e35\u0e22\u0e19\u0e40\u0e1b\u0e47\u0e19\u0e19\u0e42\u0e22\u0e1a\u0e32\u0e22 (\u0e14\u0e39 \u00a74 F0 + \u00a710)\n\n### \u0e41\u0e01\u0e48\u0e19\u0e02\u0e2d\u0e07\u0e1b\u0e31\u0e0d\u0e2b\u0e32\n> **\u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e19\u0e43\u0e19 LINE OA \u0e17\u0e38\u0e01\u0e04\u0e19\u0e40\u0e1b\u0e47\u0e19\u0e41\u0e04\u0e48\u0e23\u0e2b\u0e31\u0e2a\u0e19\u0e34\u0e23\u0e19\u0e32\u0e21 (userId) \u0e08\u0e19\u0e01\u0e27\u0e48\u0e32\u0e40\u0e02\u0e32\u0e08\u0e30 \"\u0e41\u0e15\u0e30\" \u0e40\u0e23\u0e32\u0e2b\u0e19\u0e36\u0e48\u0e07\u0e04\u0e23\u0e31\u0e49\u0e07**\n> \u0e40\u0e23\u0e32\u0e21\u0e35\u0e10\u0e32\u0e19 150,000 \u0e04\u0e19 \u0e41\u0e15\u0e48\u0e44\u0e21\u0e48\u0e23\u0e39\u0e49\u0e27\u0e48\u0e32\u0e43\u0e04\u0e23\u0e40\u0e1b\u0e47\u0e19\u0e43\u0e04\u0e23 \u0e2d\u0e22\u0e39\u0e48\u0e0a\u0e48\u0e27\u0e07\u0e44\u0e2b\u0e19 \u0e40\u0e04\u0e22\u0e0b\u0e37\u0e49\u0e2d\u0e2d\u0e30\u0e44\u0e23 \u2192 \u0e04\u0e38\u0e22\u0e41\u0e1a\u0e1a\u0e40\u0e02\u0e49\u0e32\u0e43\u0e08\u0e44\u0e21\u0e48\u0e44\u0e14\u0e49 \u0e22\u0e34\u0e07\u0e15\u0e23\u0e07\u0e01\u0e25\u0e38\u0e48\u0e21\u0e44\u0e21\u0e48\u0e44\u0e14\u0e49\n\n\u0e40\u0e1f\u0e2a 3 \u0e41\u0e01\u0e49 3 \u0e0a\u0e31\u0e49\u0e19\u0e15\u0e32\u0e21\u0e25\u0e33\u0e14\u0e31\u0e1a:\n1. **\u0e23\u0e39\u0e49\u0e08\u0e31\u0e01\u0e40\u0e02\u0e32 (Identity)** \u2014 Epic D\n2. **\u0e08\u0e33\u0e40\u0e02\u0e32\u0e44\u0e14\u0e49 (Memory)** \u2014 Epic E\n3. **\u0e04\u0e38\u0e22\u0e01\u0e31\u0e1a\u0e40\u0e02\u0e32\u0e43\u0e2b\u0e49\u0e16\u0e39\u0e01\u0e04\u0e19 \u0e16\u0e39\u0e01\u0e40\u0e27\u0e25\u0e32 (Reach)** \u2014 Epic F + G\n\n### \u0e2a\u0e34\u0e48\u0e07\u0e17\u0e35\u0e48 **\u0e44\u0e21\u0e48\u0e17\u0e33** \u0e43\u0e19\u0e40\u0e1f\u0e2a 3 (Non-goals \u2014 \u0e01\u0e31\u0e19 scope creep)\n- \u274c **\u0e44\u0e21\u0e48\u0e2a\u0e23\u0e49\u0e32\u0e07\u0e2b\u0e19\u0e49\u0e32\u0e08\u0e2d\u0e41\u0e0a\u0e17\u0e02\u0e2d\u0e07\u0e40\u0e23\u0e32\u0e40\u0e2d\u0e07** \u2014 \u0e41\u0e2d\u0e14\u0e21\u0e34\u0e19\u0e22\u0e31\u0e07\u0e43\u0e0a\u0e49 LINE Official Account Manager / \u0e41\u0e2d\u0e1b LINE OA \u0e40\u0e2b\u0e21\u0e37\u0e2d\u0e19\u0e40\u0e14\u0e34\u0e21 (\u0e40\u0e02\u0e32\u0e04\u0e38\u0e49\u0e19\u0e41\u0e25\u0e49\u0e27 \u0e41\u0e25\u0e30 LINE \u0e17\u0e33\u0e44\u0e14\u0e49\u0e14\u0e35\u0e2d\u0e22\u0e39\u0e48\u0e41\u0e25\u0e49\u0e27) \u0e40\u0e23\u0e32\u0e17\u0e33 \"\u0e0a\u0e31\u0e49\u0e19\u0e2a\u0e21\u0e2d\u0e07\" \u0e44\u0e21\u0e48\u0e43\u0e0a\u0e48 \"\u0e01\u0e25\u0e48\u0e2d\u0e07\u0e41\u0e0a\u0e17\"\n- \u274c \u0e44\u0e21\u0e48\u0e17\u0e33\u0e23\u0e30\u0e1a\u0e1a\u0e02\u0e32\u0e22/\u0e15\u0e30\u0e01\u0e23\u0e49\u0e32/\u0e0a\u0e33\u0e23\u0e30\u0e40\u0e07\u0e34\u0e19\u0e43\u0e19\u0e40\u0e1f\u0e2a\u0e19\u0e35\u0e49\n- \u274c \u0e44\u0e21\u0e48\u0e17\u0e33 AI \u0e15\u0e2d\u0e1a\u0e41\u0e0a\u0e17\u0e2d\u0e31\u0e15\u0e42\u0e19\u0e21\u0e31\u0e15\u0e34\u0e41\u0e17\u0e19\u0e04\u0e19 (\u0e1c\u0e34\u0e14\u0e40\u0e2a\u0e49\u0e19\u0e41\u0e14\u0e07 compliance \u0e40\u0e23\u0e37\u0e48\u0e2d\u0e07\u0e04\u0e33\u0e41\u0e19\u0e30\u0e19\u0e33\u0e2a\u0e38\u0e02\u0e20\u0e32\u0e1e)\n- \u274c \u0e44\u0e21\u0e48\u0e14\u0e36\u0e07\u0e1b\u0e23\u0e30\u0e27\u0e31\u0e15\u0e34\u0e41\u0e0a\u0e17\u0e40\u0e01\u0e48\u0e32\u0e22\u0e49\u0e2d\u0e19\u0e2b\u0e25\u0e31\u0e07 (LINE \u0e44\u0e21\u0e48\u0e21\u0e35 API \u0e43\u0e2b\u0e49 \u0e41\u0e25\u0e30\u0e40\u0e1b\u0e47\u0e19\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e2d\u0e48\u0e2d\u0e19\u0e44\u0e2b\u0e27)\n\n---\n\n## 1. \u0e02\u0e49\u0e2d\u0e40\u0e17\u0e47\u0e08\u0e08\u0e23\u0e34\u0e07 LINE\n**\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19\u0e01\u0e31\u0e1a\u0e40\u0e08\u0e49\u0e32\u0e02\u0e2d\u0e07\u0e41\u0e1a\u0e23\u0e19\u0e14\u0e4c\u0e41\u0e25\u0e49\u0e27 (2026-07-26):**\n- \u2705 **LINE OA \u0e21\u0e35\u0e42\u0e25\u0e48 Verified** \u2192 \u0e1b\u0e25\u0e14\u0e25\u0e47\u0e2d\u0e01\u0e01\u0e32\u0e23\u0e14\u0e36\u0e07\u0e23\u0e32\u0e22\u0e0a\u0e37\u0e48\u0e2d\u0e1c\u0e39\u0e49\u0e15\u0e34\u0e14\u0e15\u0e32\u0e21 (followers) \u0e41\u0e25\u0e30 Audience \u0e44\u0e14\u0e49\u0e40\u0e15\u0e47\u0e21\n- \u2705 **Webhook \u0e08\u0e30\u0e0a\u0e35\u0e49\u0e21\u0e32\u0e17\u0e35\u0e48\u0e23\u0e30\u0e1a\u0e1a\u0e40\u0e23\u0e32** (`/api/line/webhook`) \u2014 \u0e40\u0e23\u0e32\u0e40\u0e1b\u0e47\u0e19\u0e40\u0e08\u0e49\u0e32\u0e02\u0e2d\u0e07 webhook \u0e41\u0e15\u0e48\u0e40\u0e1e\u0e35\u0e22\u0e07\u0e1c\u0e39\u0e49\u0e40\u0e14\u0e35\u0e22\u0e27 \u0e44\u0e21\u0e48\u0e0a\u0e19\u0e01\u0e31\u0e1a vendor \u0e2d\u0e37\u0e48\u0e19\n\n| \u0e04\u0e27\u0e32\u0e21\u0e2a\u0e32\u0e21\u0e32\u0e23\u0e16 | \u0e43\u0e0a\u0e49\u0e44\u0e14\u0e49 | \u0e2b\u0e21\u0e32\u0e22\u0e40\u0e2b\u0e15\u0e38\u0e17\u0e35\u0e48\u0e21\u0e35\u0e1c\u0e25\u0e15\u0e48\u0e2d design |\n|---|---|---|\n| \u0e14\u0e36\u0e07 userId \u0e1c\u0e39\u0e49\u0e15\u0e34\u0e14\u0e15\u0e32\u0e21\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14 (`/v2/bot/followers/ids`) | \u2705 (Verified) | \u0e41\u0e1a\u0e48\u0e07\u0e2b\u0e19\u0e49\u0e32 (paginate) \u0e14\u0e49\u0e27\u0e22 cursor \u00b7 \u0e15\u0e49\u0e2d\u0e07\u0e17\u0e22\u0e2d\u0e22\u0e14\u0e36\u0e07\u0e40\u0e1b\u0e47\u0e19 batch |\n| \u0e14\u0e36\u0e07\u0e42\u0e1b\u0e23\u0e44\u0e1f\u0e25\u0e4c (`/v2/bot/profile/{userId}`) | \u2705 | \u0e44\u0e14\u0e49 **\u0e0a\u0e37\u0e48\u0e2d LINE + \u0e23\u0e39\u0e1b + \u0e20\u0e32\u0e29\u0e32** \u0e40\u0e17\u0e48\u0e32\u0e19\u0e31\u0e49\u0e19 \u2014 **\u0e44\u0e21\u0e48\u0e21\u0e35\u0e40\u0e1a\u0e2d\u0e23\u0e4c \u0e44\u0e21\u0e48\u0e21\u0e35\u0e2d\u0e35\u0e40\u0e21\u0e25 \u0e44\u0e21\u0e48\u0e21\u0e35\u0e40\u0e1e\u0e28/\u0e2d\u0e32\u0e22\u0e38\u0e23\u0e32\u0e22\u0e04\u0e19** |\n| \u0e2a\u0e23\u0e49\u0e32\u0e07 Audience \u0e08\u0e32\u0e01 userId (`/v2/bot/audienceGroup/upload`) | \u2705 | \u0e40\u0e1b\u0e47\u0e19 **\u0e07\u0e32\u0e19\u0e2d\u0e30\u0e0b\u0e34\u0e07\u0e01\u0e4c** \u0e15\u0e49\u0e2d\u0e07\u0e23\u0e2d\u0e2a\u0e16\u0e32\u0e19\u0e30 `READY` \u0e01\u0e48\u0e2d\u0e19\u0e43\u0e0a\u0e49 \u00b7 \u0e17\u0e22\u0e2d\u0e22\u0e2a\u0e48\u0e07\u0e40\u0e1b\u0e47\u0e19\u0e01\u0e49\u0e2d\u0e19 |\n| \u0e22\u0e34\u0e07\u0e40\u0e09\u0e1e\u0e32\u0e30\u0e01\u0e25\u0e38\u0e48\u0e21 (`/v2/bot/message/narrowcast`) | \u2705 | \u0e2d\u0e30\u0e0b\u0e34\u0e07\u0e01\u0e4c \u2192 \u0e15\u0e32\u0e21\u0e1c\u0e25\u0e14\u0e49\u0e27\u0e22 `requestId` |\n| \u0e2d\u0e48\u0e32\u0e19\u0e1c\u0e25\u0e41\u0e04\u0e21\u0e40\u0e1b\u0e0d (`/v2/bot/insight/message/event`) | \u2705 | \u0e44\u0e14\u0e49 \u0e2a\u0e48\u0e07\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08 / \u0e40\u0e2b\u0e47\u0e19 / \u0e01\u0e14\u0e25\u0e34\u0e07\u0e01\u0e4c |\n| \u0e2d\u0e48\u0e32\u0e19\u0e42\u0e04\u0e27\u0e15\u0e32\u0e02\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21\u0e04\u0e07\u0e40\u0e2b\u0e25\u0e37\u0e2d (`/v2/bot/message/quota/consumption`) | \u2705 | **\u0e43\u0e0a\u0e49\u0e17\u0e33\u0e41\u0e14\u0e0a\u0e1a\u0e2d\u0e23\u0e4c\u0e14\u0e15\u0e49\u0e19\u0e17\u0e38\u0e19\u0e08\u0e23\u0e34\u0e07 \u0e44\u0e21\u0e48\u0e15\u0e49\u0e2d\u0e07\u0e40\u0e14\u0e32** |\n| \u0e2a\u0e16\u0e34\u0e15\u0e34\u0e1c\u0e39\u0e49\u0e15\u0e34\u0e14\u0e15\u0e32\u0e21\u0e23\u0e32\u0e22\u0e27\u0e31\u0e19 (`/v2/bot/insight/followers`) | \u2705 | \u0e44\u0e14\u0e49 \u0e1c\u0e39\u0e49\u0e15\u0e34\u0e14\u0e15\u0e32\u0e21 / \u0e22\u0e34\u0e07\u0e16\u0e36\u0e07\u0e44\u0e14\u0e49 / **\u0e08\u0e33\u0e19\u0e27\u0e19\u0e1a\u0e25\u0e47\u0e2d\u0e01** \u2190 \u0e2a\u0e33\u0e04\u0e31\u0e0d\u0e21\u0e32\u0e01\u0e2a\u0e33\u0e2b\u0e23\u0e31\u0e1a circuit breaker |\n| \u0e1b\u0e23\u0e30\u0e0a\u0e32\u0e01\u0e23\u0e28\u0e32\u0e2a\u0e15\u0e23\u0e4c\u0e02\u0e2d\u0e07\u0e10\u0e32\u0e19 (`/v2/bot/insight/demographic`) | \u2705 | \u0e20\u0e32\u0e1e\u0e23\u0e27\u0e21\u0e40\u0e1e\u0e28/\u0e2d\u0e32\u0e22\u0e38/\u0e1e\u0e37\u0e49\u0e19\u0e17\u0e35\u0e48 **\u0e41\u0e1a\u0e1a\u0e23\u0e27\u0e21 \u0e44\u0e21\u0e48\u0e23\u0e30\u0e1a\u0e38\u0e15\u0e31\u0e27\u0e15\u0e19** \u00b7 LINE \u0e0b\u0e48\u0e2d\u0e19\u0e1c\u0e25\u0e16\u0e49\u0e32\u0e40\u0e1b\u0e49\u0e32\u0e2b\u0e21\u0e32\u0e22\u0e19\u0e49\u0e2d\u0e22\u0e40\u0e01\u0e34\u0e19\u0e44\u0e1b |\n| \u0e40\u0e1b\u0e25\u0e35\u0e48\u0e22\u0e19 Rich Menu \u0e23\u0e32\u0e22\u0e04\u0e19 | \u2705 | \u0e04\u0e19\u0e17\u0e35\u0e48\u0e1c\u0e39\u0e01\u0e41\u0e25\u0e49\u0e27 vs \u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e1c\u0e39\u0e01 \u0e40\u0e2b\u0e47\u0e19\u0e40\u0e21\u0e19\u0e39\u0e04\u0e19\u0e25\u0e30\u0e41\u0e1a\u0e1a |\n| LIFF (\u0e40\u0e27\u0e47\u0e1a\u0e40\u0e23\u0e32\u0e23\u0e31\u0e19\u0e43\u0e19\u0e41\u0e2d\u0e1b LINE) | \u2705 | **\u0e44\u0e14\u0e49 userId \u0e42\u0e14\u0e22\u0e1c\u0e39\u0e49\u0e43\u0e0a\u0e49\u0e44\u0e21\u0e48\u0e15\u0e49\u0e2d\u0e07\u0e1e\u0e34\u0e21\u0e1e\u0e4c\u0e2d\u0e30\u0e44\u0e23\u0e40\u0e25\u0e22** |\n| **\u0e2d\u0e48\u0e32\u0e19/\u0e40\u0e02\u0e35\u0e22\u0e19 \"\u0e41\u0e17\u0e47\u0e01\u0e43\u0e19\u0e2b\u0e49\u0e2d\u0e07\u0e41\u0e0a\u0e17\" \u0e02\u0e2d\u0e07 OA Manager** | \u274c **\u0e44\u0e21\u0e48\u0e21\u0e35 API** | \u2192 **\u0e23\u 48\u0e2d unfollow \u0e41\u0e25\u0e49\u0e27 follow \u0e43\u0e2b\u0e21\u0e48\n- [ ] \u0e2b\u0e19\u0e49\u0e32\u0e08\u0e31\u0e14\u0e01\u0e32\u0e23\u0e40\u0e21\u0e19\u0e39\u0e43\u0e19 `/crm/settings/line` (\u0e2d\u0e31\u0e1b\u0e42\u0e2b\u0e25\u0e14\u0e20\u0e32\u0e1e + \u0e1c\u0e39\u0e01/\u0e16\u0e2d\u0e14 + \u0e14\u0e39\u0e27\u0e48\u0e32\u0e43\u0e04\u0e23\u0e43\u0e0a\u0e49\u0e40\u0e21\u0e19\u0e39\u0e44\u0e2b\u0e19)\n\n### D3 \u00b7 Webhook \u0e02\u0e22\u0e32\u0e22 (P0)\n\u0e40\u0e1e\u0e34\u0e48\u0e21\u0e08\u0e32\u0e01\u0e40\u0e1f\u0e2a 2 (\u0e0b\u0e36\u0e48\u0e07\u0e08\u0e31\u0e1a\u0e41\u0e04\u0e48\u0e02\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21\u0e17\u0e35\u0e48\u0e21\u0e35\u0e23\u0e2b\u0e31\u0e2a MJ-XXXXXX):\n- [ ] `follow` \u2192 \u0e2a\u0e23\u0e49\u0e32\u0e07 `line_profiles` (\u0e2a\u0e16\u0e32\u0e19\u0e30 `active`) + \u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01 `interactions` + \u0e2a\u0e48\u0e07\u0e02\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21\u0e15\u0e49\u0e2d\u0e19\u0e23\u0e31\u0e1a (reply = \u0e1f\u0e23\u0e35) + \u0e1c\u0e39\u0e01\u0e40\u0e21\u0e19\u0e39 A\n- [ ] `unfollow` \u2192 \u0e15\u0e31\u0e49\u0e07\u0e2a\u0e16\u0e32\u0e19\u0e30 `blocked` + \u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01\u0e40\u0e27\u0e25\u0e32 \u2192 **\u0e15\u0e31\u0e14\u0e2d\u0e2d\u0e01\u0e08\u0e32\u0e01\u0e17\u0e38\u0e01 segment \u0e2d\u0e31\u0e15\u0e42\u0e19\u0e21\u0e31\u0e15\u0e34** (\u0e01\u0e31\u0e19\u0e22\u0e34\u0e07\u0e17\u0e34\u0e49\u0e07\u0e40\u0e1b\u0e25\u0e48\u0e32/\u0e40\u0e2a\u0e35\u0e22\u0e40\u0e07\u0e34\u0e19\u0e1f\u0e23\u0e35)\n- [ ] `message` (\u0e17\u0e38\u0e01\u0e02\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21 \u0e44\u0e21\u0e48\u0e43\u0e0a\u0e48\u0e41\u0e04\u0e48\u0e21\u0e35\u0e23\u0e2b\u0e31\u0e2a) \u2192 \u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01 `interactions` type=`inbound` + \u0e2d\u0e31\u0e1b\u0e40\u0e14\u0e15 `last_active_at` (\u0e44\u0e21\u0e48\u0e40\u0e01\u0e47\u0e1a\u0e40\u0e19\u0e37\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21\u0e42\u0e14\u0e22\u0e04\u0e48\u0e32\u0e40\u0e23\u0e34\u0e48\u0e21\u0e15\u0e49\u0e19 \ 0e19 | \u0e21\u0e35\u0e1b\u0e23\u0e30\u0e42\u0e22\u0e0a\u0e19\u0e4c\u0e08\u0e23\u0e34\u0e07 \u0e17\u0e33\u0e43\u0e2b\u0e49\u0e40\u0e02\u0e32\u0e23\u0e2d\u0e02\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21\u0e40\u0e23\u0e32 |\n| \u0e40\u0e07\u0e35\u0e22\u0e1a\u0e44\u0e1b 60 \u0e27\u0e31\u0e19 | \u0e44\u0e21\u0e48\u0e21\u0e35\u0e01\u0e34\u0e08\u0e01\u0e23\u0e23\u0e21\u0e40\u0e25\u0e22 | \u0e16\u0e32\u0e21\u0e44\u0e16\u0e48 1 \u0e04\u0e23\u0e31\u0e49\u0e07 + \u0e1b\u0e38\u0e48\u0e21 \"\u0e2b\u0e22\u0e38\u0e14\u0e23\u0e31\u0e1a\u0e02\u0e48\u0e32\u0e27\u0e2a\u0e32\u0e23\" | \u0e1b\u0e25\u0e38\u0e01\u0e01\u0e48\u0e2d\u0e19\u0e2b\u0e32\u0e22 \u0e44\u0e21\u0e48\u0e15\u0e37\u0e4a\u0e2d |\n| \u0e0a\u0e27\u0e19\u0e04\u0e39\u0e48 | \u0e1c\u0e39\u0e49\u0e2b\u0e0d\u0e34\u0e07\u0e17\u0e35\u0e48\u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e21\u0e35\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e1d\u0e48\u0e32\u0e22\u0e0a\u0e32\u0e22 | \u0e01\u0e32\u0e23\u0e4c\u0e14\u0e2a\u0e48\u0e07\u0e15\u0e48\u0e2d\u0e43\u0e2b\u0e49\u0e2a\u0e32\u0e21\u0e35 | \u0e1b\u0e31\u0e08\u0e08\u0e31\u0e22\u0e1d\u0e48\u0e32\u0e22\u0e0a\u0e32\u0e22 ~40% (\u0e2d\u0e49\u0e32\u0e07 PRD-PHASE2) |\n\n- [ ] \u26a0\ufe0f **\u0e02\u0e49\u0e2d\u0e2b\u0e49\u0e32\u0e21\u0e40\u0e0a\u0e34\u0e07\u0e08\u0e23\u0e34\u0e22\u0e18\u0e23\u0e23\u0e21:** \u0e2b\u0e49\u0e32\u0e21\u0e2a\u0e48\u0e07\u0e2d\u0e31\u0e15\u0e42\u0e19\u0e21\u0e31\u0e15\u0e34\u0e40\u0e01\u0e35\u0e48\u0e22\u0e27\u0e01\u0e31\u0e1a\u0e1c\u0e25\u0e15\u0e31\u0e49\u0e07\u0e04\u0e23\u0e23\u0e20\u0e4c/\u0e41\u0e17\u0e49\u0e07/\u0e23\u0e2d\u0e1a\u0e40\u0e14\u0e37\u0e2d\u0e19\u0e17\u0e35\u0e48\u0e15\u0e35\u0e04\u0e27\u0e32\u0e21\u0e27\u0e48\u0e32 \"\u0e25\u0e49\u0e21\u0e40\u0e2b\u0e25\u0e27\" \u00b7 \u0e2b\u0e49\u0e32\u0e21\u0e43\u0e0a\u0e49\u0e04\u0e27\u0e32\u0e21\u0e01\u0e25\u0e31\u0e27\u0e40\u0e1b\u0e47\u0e19\u0e41\u0e23\u0e07\u0e08\u0e39\u0e07\u0e43\u0e08 \u00b7 \u0e17\u0e38\u0e01 journey \u0e15\u0e49\u0e2d\u0e07\u0e1c\u0e48\u0e32\u0e19 red-team (lucifer) \u0e01\u0e48\u0e2d\u0e19\u0e40\u0e1b\u0e34\u0e14\u0e43\u0e0a\u0e49\n- [ ] \u0e04\u0e19\u0e17\u0e35\u0e48\u0e01\u0e14 \"\u0e15\u0e2d\u0e19\u0e19\u0e35\u0e49\u0e09\u0e31\u0e19\u0e17\u0e49\u0e2d\u0e07\u0e41\u0e25\u0e49\u0e27\" \u2192 **\u0e22\u0e49\u0e32\u0e22\u0e2d\u0e2d\u0e01\u0e08\u0e32\u0e01 journey \u0e40\u0e15\u0e23\u0e35\u0e22\u0e21\u0e17\u0e49\u0e2d\u0e07\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14\u0e17\u0e31\u0e19\u0e17\u0e35**\n\n---\n\n## 6. Data Model\n**Migration `0003_phase3.sql`** \u2014 \u0e40\u0e1e\u0e34\u0e48\u0e21\u0e2d\u0e22\u0e48\u0e32\u0e07\u0e40\u0e14\u0e35\u0e22\u0e27 \u0e44\u0e21\u0e48\u0e25\u0e1a/\u0e44\u0e21\u0e48\u0e41\u0e01\u0e49\u0e02\u0e2d\u0e07\u0e40\u0e14\u0e34\u0e21 (\u0e15\u0e32\u0e23\u0e32\u0e07\u0e40\u0e14\u0e34\u0e21\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14\u0e02\u0e2d\u0e07\u0e40\u0e1f\u0e2a 1\u20132 \u0e43\u0e0a\u0e49\u0e15\u0e48\u0e2d)\n\n| \u0e15\u0e32\u0e23\u0e32\u0e07 | \u0e2b\u0e19\u0e49\u0e32\u0e17\u0e35\u0e48 | \u0e1f\u0e34\u0e25\u0e14\u0e4c\u0e2a\u0e33\u0e04\u0e31\u0e0d |\n|---|---|---|\n| `customers` | **\u0e41\u0e01\u0e19\u0e15\u0e31\u0e27\u0e15\u0e19** 1 \u0e04\u0e19 = 1 \u0e41\u0e16\u0e27 (\u0e04\u0e19\u0e2b\u0e19\u0e36\u0e48\u0e07\u0e01\u0e23\u0e2d\u0e01\u0e1f\u0e2d\u0e23\u0e4c\u0e21\u0e44\u0e14\u0e49\u0e2b\u0e25\u0e32\u0e22\u0e23\u0e2d\u0e1a = \u0e2b\u0e25\u0e32\u0e22 `leads` \u0e41\u0e15\u0e48\u0e40\u0e1b\u0e47\u0e19\u0e04\u0e19\u0e40\u0e14\u0e35\u0e22\u0e27) | `id` \u00b7 `display_name` \u00b7 `primary_lead_id` \u00b7 `owner_staff_id` \u00b7 `status`(new/active/nurturing/customer/closed) \u00b7 `first_seen_at` \u00b7 `last_active_at` \u00b7 `lifetime_value` |\n| `line_profiles` | \u0e02\u0e22\u0e32\u0e22\u0e08\u0e32\u0e01 `line_bindings` | `line_user_id`(unique) \u00b7 `customer_id` \u00b7 `display_name` \u00b7 `picture_url` \u00b7 `language` \u00b7 `follow_state`(anonymous/active/blocked) \u00b7 `rich_menu_variant` \u00b7 `source` \u00b7 `followed_at` \u00b7 `unfollowed_at` |\n| `interactions` | **\u0e44\u0e17\u0e21\u0e4c\u0e44\u0e25\u0e19\u0e4c** \u0e17\u0e38\u0e01\u0e40\u0e2b\u0e15\u0e38\u0e01\u0e32\u0e23\u0e13\u0e4c | `customer_id` \u00b7 `kind`(inbound/outbound/tool/report_view/link_click/campaign/purchase/note/system) \u00b7 `channel` \u00b7 `ref_id` \u00b7 `summary` \u00b7 `meta` jsonb \u00b7 `occurred_at` |\n| `customer_notes` | \u0e42\u0e19\u0e49\u0e15\u0e20\u0e32\u0e22\u0e43\u0e19\u0e02\u0e2d\u0e07\u0e17\u0e35\u0e21 | `customer_id` \u00b7 `staff_id` \u00b7 `body` \u00b7 `created_at` |\n| `segments` | \u0e19\u0e34\u0e22\u0e32\u0e21\u0e01\u0e25\u0e38\u0e48\u0e21 | `name` \u00b7 `mode`(dynamic/snapshot) \u00b7 `rules` jsonb \u00b7 `created_by` \u00b7 `last_count` \u00b7 `last_counted_at` |\n| `segment_members` | \u0e2a\u0e21\u0e32\u0e0a\u0e34\u0e01\u0e02\u0e2d\u0e07 snapshot | `segment_id` \u00b7 `customer_id` |\n| `line_audiences` | \u0e1c\u0e39\u0e01 segment \u2194 LINE | `segment_id` \u00b7 `audience_group_id` \u00b7 `status` \u00b7 `size` \u00b7 `synced_at` \u00b7 `error` |\n| `campaigns` | \u0e41\u0e04\u0e21\u0e40\u0e1b\u0e0d | `name` \u00b7 `segment_id` \u00b7 `message` jsonb \u00b7 `status`(draft/scheduled/sending/done/paused/failed) \u00b7 `waves` \u00b7 `est_recipients` \u00b7 `est_cost` \u00b7 `approved_by` \u00b7 `sent_at` |\n| `campaign_recipients` | \u0e1c\u0e25\u0e23\u0e32\u0e22\u0e04\u0e19 | `campaign_id` \u00b7 `customer_id` \u00b7 `state`(queued/sent/failed/skipped) \u00b7 `skip_reason` \u00b7 `impressed` \u00b7 `clicked` \u00b7 `blocked_after` |\n| `automations` + `automation_runs` | journey + \u0e1b\u0e23\u0e30\u0e27\u0e31\u0e15\u0e34\u0e01\u0e32\u0e23\u0e17\u0e33\u0e07\u0e32\u0e19 | `trigger` \u00b7 `conditions` jsonb \u00b7 `delay_hours` \u00b7 `message` jsonb \u00b7 `active` \u00b7 `stop_on_inbound` |\n| `consents` | **\u0e41\u0e22\u0e01\u0e04\u0e27\u0e32\u0e21\u0e22\u0e34\u0e19\u0e22\u0e2d\u0e21\u0e40\u0e1b\u0e47\u0e19\u0e1b\u0e23\u0e30\u0e40\u0e20\u0e17** | `customer_id` \u00b7 `kind`(health_data/marketing/line_message) \u00b7 `granted` \u00b7 `policy_version` \u00b7 `source` \u00b7 `created_at` |\n| `purchases` (\u0e17\u0e32\u0e07\u0e40\u0e25\u0e37\u0e2d\u0e01) | \u0e1b\u0e23\u0e30\u0e27\u0e31\u0e15\u0e34\u0e2a\u0e31\u0e48\u0e07\u0e0b\u0e37\u0e49\u0e2d \u0e16\u0e49\u0e32\u0e41\u0e1a\u0e23\u0e19\u0e14\u0e4c\u0e41\u0e0a\u0e23\u0e4c | `customer_id` \u00b7 `order_ref` \u00b7 `sku` \u00b7 `amount` \u00b7 `ordered_at` |\n| `line_quota_log` | \u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01\u0e42\u0e04\u0e27\u0e15\u0e32\u0e23\u0e32\u0e22\u0e27\u0e31\u0e19 | `date` \u00b7 `used` \u00b7 `limit` \u00b7 `fetched_at` |\n\n**\u0e01\u0e32\u0e23\u0e40\u0e0a\u0e37\u0e48\u0e2d\u0e21\u0e01\u0e31\u0e1a\u0e02\u0e2d\u0e07\u0e40\u0e14\u0e34\u0e21:**\n- `leads.customer_id` (\u0e40\u0e1e\u0e34\u0e48\u0e21\u0e04\u0e2d\u0e25\u0e31\u0e21\u0e19\u0e4c) \u2014 lead \u0e17\u0e38\u0e01\u0e2d\u0e31\u0e19\u0e2a\u0e31\u0e07\u0e01\u0e31\u0e14\u0e25\u0e39\u0e01\u0e04\u0e49\u0e32 1 \u0e04\u0e19\n- `line_bindings` \u0e04\u0e07\u0e44\u0e27\u0e49\u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e04\u0e27\u0e32\u0e21\u0e40\u0e02\u0e49\u0e32\u0e01\u0e31\u0e19\u0e44\u0e14\u0e49 \u0e41\u0e15\u0e48 **`line_profiles` \u0e40\u0e1b\u0e47\u0e19\u0e41\u0e2b\u0e25\u0e48\u0e07\u0e04\u0e27\u0e32\u0e21\u0e08\u0e23\u0e34\u0e07\u0e43\u0e2b\u0e21\u0e48** (\u0e40\u0e02\u0e35\u0e22\u0e19\u0e17\u0e31\u0e49\u0e07\u0e2a\u0e2d\u0e07\u0e15\u0e2d\u0e19\u0e1c\u0e39\u0e01)\n- `tag_assignments` \u0e22\u0e49\u0e32\u0e22\u0e21\u0e32\u0e2d\u0e49\u0e32\u0e07 `customer_id` \u0e44\u0e14\u0e49\u0e14\u0e49\u0e27\u0e22 (\u0e23\u0e2d\u0e07\u0e23\u0e31\u0e1a\u0e17\u0e31\u0e49\u0e07\u0e2a\u0e2d\u0e07\u0e23\u0e30\u0e2b\u0e27\u0e48\u0e32\u0e07\u0e40\u0e1b\u0e25\u0e35\u0e48\u0e22\u0e19\u0e1c\u0e48\u0e32\u0e19)\n- RLS \u0e1b\u0e34\u0e14\u0e15\u0e32\u0e22\u0e17\u0e38\u0e01\u0e15\u0e32\u0e23\u0e32\u0e07\u0e40\u0e2b\u0e21\u0e37\u0e2d\u0e19\u0e40\u0e14\u0e34\u0e21 \u2014 \u0e40\u0e02\u0e49\u0e32\u0e16\u0e36\u0e07\u0e1c\u0e48\u0e32\u0e19 BFF/service role \u0e40\u0e17\u0e48\u0e32\u0e19\u0e31\u0e49\u0e19\n\n**\u0e2a\u0e34\u0e17\u0e18\u0e34\u0e4c\u0e43\u0e2b\u0e21\u0e48 (RBAC):** `view_crm` \u00b7 `edit_customer` \u00b7 `manage_segments` \u00b7 `send_campaign` \u00b7 `import_base` \u00b7 `manage_automations`\n> `send_campaign` \u0e41\u0e25\u0e30 `import_base` **\u0e43\u0e2b\u0e49\u0e40\u0e09\u0e1e\u0e32\u0e30 admin \u0e42\u0e14\u0e22\u0e04\u0e48\u0e32\u0e40\u0e23\u0e34\u0e48\u0e21\u0e15\u0e49\u0e19** \u0e40\u0e1e\u0e23\u0e32\u0e30\u0e21\u0e35\u0e1c\u0e25\u0e01\u0e23\u0e30\u0e17\u0e1a\u0e20\u0e32\u0e22\u0e19\u0e2d\u0e01\u0e41\u0e25\u0e30\u0e21\u0e35\u0e04\u0e48\u0e32\u0e43\u0e0a\u0e49\u0e08\u0e48\u0e32\u0e22\n\n---\n\n## 7. API Surface\n\u0e17\u0e38\u0e01\u0e40\u0e2a\u0e49\u0e19\u0e17\u0e32\u0e07\u0e1c\u0e48\u0e32\u0e19 BFF \u00b7 \u0e15\u0e23\u0e27\u0e08\u0e2a\u0e34\u0e17\u0e18\u0e34\u0e4c\u0e17\u0e38\u0e01\u0e04\u0e23\u0e31\u0e49\u0e07 \u00b7 \u0e40\u0e1a\u0e23\u0e32\u0e27\u0e4c\u0e40\u0e0b\u0e2d\u0e23\u0e4c\u0e44\u0e21\u0e48\u0e41\u0e15\u0e30 Supabase/LINE \u0e42\u0e14\u0e22\u0e15\u0e23\u0e07\n\n| Endpoint | \u0e2a\u0e34\u0e17\u0e18\u0e34\u0e4c | \u0e17\u0e33\u0e2d\u0e30\u0e44\u0e23 |\n|---|---|---|\n| `POST /api/liff/connect` | \u0e2a\u0e32\u0e18\u0e32\u0e23\u0e13\u0e30 (\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19\u0e14\u0e49\u0e27\u0e22 ID token) | \u0e15\u0e23\u0e27\u0e08 ID token \u0e01\u0e31\u0e1a LINE \u2192 upsert profile/customer \u2192 \u0e04\u0e37\u0e19\u0e2a\u0e16\u0e32\u0e19\u0e30 + \u0e40\u0e2a\u0e49\u0e19\u0e17\u0e32\u0e07\u0e16\u0e31\u0e14\u0e44\u0e1b |\n| `POST /api/line/webhook` | \u0e15\u0e23\u0e27\u0e08 signature | \u0e40\u0e1e\u0e34\u0e48\u0e21 follow/unfollow/postback/message (\u0e02\u0e22\u0e32\u0e22\u0e08\u0e32\u0e01\u0e40\u0e1f\u0e2a 2) |\n| `GET /api/crm/overview` | `view_crm` | \u0e15\u0e31\u0e27\u0e40\u0e25\u0e02\u0e41\u0e14\u0e0a\u0e1a\u0e2d\u0e23\u0e4c\u0e14 + \u0e42\u0e04\u0e27\u0e15\u0e32 |\n| `GET /api/crm/customers` | `view_crm` | \u0e04\u0e49\u0e19/\u0e01\u0e23\u0e2d\u0e07/\u0e41\u0e1a\u0e48\u0e07\u0e2b\u0e19\u0e49\u0e32 |\n| `GET /api/crm/customers/[id]` | `view_crm` | \u0e42\u0e1b\u0e23\u0e44\u0e1f\u0e25\u0e4c + \u0e44\u0e17\u0e21\u0e4c\u0e44\u0e25\u0e19\u0e4c + \u0e42\u0e19\u0e49\u0e15 |\n| `PATCH /api/crm/customers/[id]` | `edit_customer` | \u0e2a\u0e16\u0e32\u0e19\u0e30 \u00b7 \u0e1c\u0e39\u0e49\u0e23\u0e31\u0e1a\u0e1c\u0e34\u0e14\u0e0a\u0e2d\u0e1a \u00b7 \u0e41\u0e17\u0e47\u0e01\u0e21\u0e37\u0e2d |\n| `POST /api/crm/customers/[id]/notes` | `edit_customer` | \u0e40\u0e1e\u0e34\u0e48\u0e21\u0e42\u0e19\u0e49\u0e15 |\n| `POST /api/crm/customers/[id]/dsr` | `manage_users` | \u0e2a\u0e48\u0e07\u0e2d\u0e2d\u0e01/\u0e25\u0e1a\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e15\u0e32\u0e21\u0e04\u0e33\u0e02\u0e2d PDPA |\n| `GET\u00b7POST /api/crm/segments` | `manage_segments` | \u0e23\u0e32\u0e22\u0e01\u0e32\u0e23/\u0e2a\u0e23\u0e49\u0e32\u0e07 |\n| `POST /api/crm/segments/preview` | `manage_segments` | \u0e19\u0e31\u0e1a\u0e08\u0e33\u0e19\u0e27\u0e19\u0e2a\u0e14 (\u0e44\u0e21\u0e48\u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01) |\n| `POST /api/crm/segments/[id]/sync` | `manage_segments` | \u0e2a\u0e48\u0e07\u0e40\u0e02\u0e49\u0e32 LINE \u0e40\u0e1b\u0e47\u0e19 Audience |\n| `GET\u00b7POST /api/crm/campaigns` | `send_campaign` | \u0e23\u0e32\u0e22\u0e01\u0e32\u0e23/\u0e2a\u0e23\u0e49\u0e32\u0e07\u0e23\u0e48\u0e32\u0e07 |\n| `POST /api/crm/campaigns/[id]/test` | `send_campaign` | \u0e2a\u0e48\u0e07\u0e17\u0e14\u0e2a\u0e2d\u0e1a\u0e2b\u0e32\u0e15\u0e31\u0e27\u0e40\u0e2d\u0e07 |\n| `POST /api/crm/campaigns/[id]/send` | `send_campaign` | \u0e2a\u0e48\u0e07\u0e08\u0e23\u0e34\u0e07 (\u0e1c\u0e48\u0e32\u0e19 guardrail \u00a710) |\n| `POST /api/crm/campaigns/[id]/pause` | `send_campaign` | \u0e2b\u0e22\u0e38\u0e14\u0e23\u0e30\u0e25\u0e2d\u0e01\u0e17\u0e35\u0e48\u0e40\u0e2b\u0e25\u0e37\u0e2d |\n| `GET /api/crm/campaigns/[id]/results` | `view_crm` | \u0e1c\u0e25\u0e23\u0e32\u0e22\u0e04\u0e19 + \u0e2a\u0e23\u0e38\u0e1b |\n| `POST /api/crm/line/backfill` | `import_base` | \u0e14\u0e36\u0e07\u0e1c\u0e39\u0e49\u0e15\u0e34\u0e14\u0e15\u0e32\u0e21\u0e17\u0e35\u0e25\u0e30\u0e2b\u0e19\u0e49\u0e32 |\n| `GET\u00b7POST /api/crm/line/richmenu` | `line_admin` | \u0e08\u0e31\u0e14\u0e01\u0e32\u0e23\u0e40\u0e21\u0e19\u0e39 |\n| `GET /api/crm/line/quota` | `view_crm` | \u0e42\u0e04\u0e27\u0e15\u0e32\u0e04\u0e07\u0e40\u0e2b\u0e25\u0e37\u0e2d |\n| `POST /api/cron/automations` | secret header | \u0e40\u0e04\u0e23\u0e37\u0e48\u0e2d\u0e07\u0e22\u0e19\u0e15\u0e4c journey |\n\n---\n\n## 8. \u0e2b\u0e19\u0e49\u0e32\u0e08\u0e2d\n> **\u0e14\u0e39\u0e02\u0e2d\u0e07\u0e08\u0e23\u0e34\u0e07\u0e1e\u0e23\u0e49\u0e2d\u0e21\u0e2a\u0e35\u0e08\u0e23\u0e34\u0e07\u0e44\u0e14\u0e49\u0e17\u0e35\u0e48** `crm-flow-65641ac5.html` (13 \u0e2b\u0e19\u0e49\u0e32\u0e08\u0e2d + 6 \u0e42\u0e1f\u0e25\u0e27\u0e4c)\n\n| # | \u0e2b\u0e19\u0e49\u0e32\u0e08\u0e2d | \u0e43\u0e04\u0e23 | \u0e2a\u0e32\u0e23\u0e30 |\n|---|---|---|---|\n| S1 | `/crm` \u0e41\u0e14\u0e0a\u0e1a\u0e2d\u0e23\u0e4c\u0e14\u0e2a\u0e38\u0e02\u0e20\u0e32\u0e1e\u0e10\u0e32\u0e19 | \u0e41\u0e2d\u0e14\u0e21\u0e34\u0e19/\u0e40\u0e08\u0e49\u0e32\u0e02\u0e2d\u0e07 | \u0e23\u0e39\u0e49\u0e08\u0e31\u0e01\u0e41\u0e25\u0e49\u0e27\u0e01\u0e35\u0e48 % \u00b7 \u0e1a\u0e25\u0e47\u0e2d\u0e01 \u00b7 \u0e42\u0e04\u0e27\u0e15\u0e32 |\n| S2 | `/crm/customers` \u0e23\u0e32\u0e22\u0e0a\u0e37\u0e48\u0e2d | \u0e17\u0e35\u0e21 | \u0e01\u0e23\u0e2d\u0e07 + \u0e40\u0e25\u0e37\u0e2d\u0e01\u0e2b\u0e25\u0e32\u0e22\u0e23\u0e32\u0e22\u0e01\u0e32\u0e23 \u2192 \u0e2a\u0e23\u0e49\u0e32\u0e07 segment |\n| S3 | `/crm/c/[id]` **Customer 360** | \u0e17\u0e35\u0e21 | \u0e2b\u0e31\u0e27\u0e01\u0e32\u0e23\u0e4c\u0e14 + \u0e44\u0e17\u0e21\u0e4c\u0e44\u0e25\u0e19\u0e4c + \u0e42\u0e19\u0e49\u0e15 + \u0e41\u0e1c\u0e07\u0e25\u0e07\u0e21\u0e37\u0e2d |\n| S4 | `/crm/segments` \u0e23\u0e32\u0e22\u0e01\u0e32\u0e23\u0e01\u0e25\u0e38\u0e48\u0e21 | \u0e17\u0e35\u0e21 | \u0e2a\u0e16\u0e32\u0e19\u0e30\u0e0b\u0e34\u0e07\u0e01\u0e4c\u0e40\u0e02\u0e49\u0e32 LINE |\n| S5 | `/crm/segments/new` \u0e15\u0e31\u0e27\u0e2a\u0e23\u0e49\u0e32\u0e07\u0e01\u0e25\u0e38\u0e48\u0e21 | \u0e17\u0e35\u0e21 | \u0e40\u0e07\u0e37\u0e48\u0e2d\u0e19\u0e44\u0e02 + \u0e19\u0e31\u0e1a\u0e2a\u0e14 + \u0e15\u0e31\u0e27\u0e17\u0e35\u0e48\u0e16\u0e39\u0e01\u0e15\u0e31\u0e14\u0e2d\u0e2d\u0e01 |\n| S6 | `/crm/campaigns` \u0e23\u0e32\u0e22\u0e01\u0e32\u0e23\u0e41\u0e04\u0e21\u0e40\u0e1b\u0e0d | \u0e17\u0e35\u0e21 | \u0e1c\u0e25 + \u0e15\u0e49\u0e19\u0e17\u0e38\u0e19\u0e08\u0e23\u0e34\u0e07 |\n| S7 | `/crm/campaigns/new` \u0e15\u0e31\u0e27\u0e40\u0e02\u0e35\u0e22\u0e19 3 \u0e02\u0e31\u0e49\u0e19 | \u0e17\u0e35\u0e21 | \u0e15\u0e31\u0e27\u0e2d\u0e22\u0e48\u0e32\u0e07\u0e2b\u0e19\u0e49\u0e32\u0e08\u0e2d LINE + \u0e15\u0e23\u0e27\u0e08 compliance + \u0e1b\u0e23\u0e30\u0e21\u0e32\u0e13\u0e15\u0e49\u0e19\u0e17\u0e38\u0e19 |\n| S8 | `/crm/campaigns/[id]` \u0e1c\u0e25\u0e25\u0e31\u0e1e\u0e18\u0e4c | \u0e17\u0e35\u0e21 | \u0e2a\u0e48\u0e07/\u0e40\u0e2b\u0e47\u0e19/\u0e01\u0e14/\u0e1a\u0e25\u0e47\u0e2d\u0e01 + \u0e23\u0e32\u0e22\u0e04\u0e19 |\n| S9 | `/crm/automations` | \u0e41\u0e2d\u0e14\u0e21\u0e34\u0e19 | \u0e40\u0e1b\u0e34\u0e14-\u0e1b\u0e34\u0e14 journey |\n| S10 | `/crm/settings/line` | \u0e41\u0e2d\u0e14\u0e21\u0e34\u0e19 | \u0e2a\u0e16\u0e32\u0e19\u0e30 channel \u00b7 \u0e40\u0e21\u0e19\u0e39 \u00b7 \u0e42\u0e04\u0e27\u0e15\u0e32 \u00b7 \u0e14\u0e36\u0e07\u0e10\u0e32\u0e19 |\n| S11 | `/liff/connect` | **\u0e25\u0e39\u0e01\u0e04\u0e49\u0e32** (\u0e21\u0e37\u0e2d\u0e16\u0e37\u0e2d) | \u0e2b\u0e19\u0e49\u0e32\u0e40\u0e0a\u0e37\u0e48\u0e2d\u0e21\u0e15\u0e48\u0e2d 1 \u0e08\u0e2d \u0e44\u0e21\u0e48\u0e15\u0e49\u0e2d\u0e07\u0e1e\u0e34\u0e21\u0e1e\u0e4c |\n| S12 | Rich Menu A / B | **\u0e25\u0e39\u0e01\u0e04\u0e49\u0e32** | \u0e40\u0e21\u0e19\u0e39\u0e25\u0e48\u0e32\u0e07\u0e2a\u0e2d\u0e07\u0e41\u0e1a\u0e1a |\n| S13 | \u0e02\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21\u0e43\u0e19 LINE | **\u0e25\u0e39\u0e01\u0e04\u0e49\u0e32** | \u0e15\u0e49\u0e2d\u0e19\u0e23\u0e31\u0e1a \u00b7 \u0e16\u0e32\u0e21\u0e0a\u0e48\u0e27\u0e07\u0e0a\u0e35\u0e27\u0e34\u0e15 \u00b7 \u0e40\u0e15\u0e37\u0e2d\u0e19\u0e44\u0e02\u0e48\u0e15\u0e01 \u00b7 \u0e2b\u0e22\u0e38\u0e14\u0e23\u0e31\u0e1a\u0e02\u0e48\u0e32\u0e27\u0e2a\u0e32\u0e23 |\n| **S14** | `/crm/reach` **\u0e41\u0e1c\u0e07\u0e0a\u0e48\u0e2d\u0e07\u0e17\u0e32\u0e07\u0e1f\u0e23\u0e35 (Reach Planner)** \ud83c\udd95 | \u0e41\u0e2d\u0e14\u0e21\u0e34\u0e19 | \u0e40\u0e21\u0e19\u0e39\u0e25\u0e48\u0e32\u0e07 \u00b7 \u0e04\u0e35\u0e22\u0e4c\u0e40\u0e27\u0e34\u0e23\u0e4c\u0e14 \u00b7 VOOM \u00b7 QR \u0e19\u0e2d\u0e01 LINE \u2014 \u0e40\u0e2b\u0e47\u0e19\u0e27\u0e48\u0e32\u0e0a\u0e48\u0e2d\u0e07\u0e17\u0e32\u0e07\u0e44\u0e2b\u0e19\u0e1e\u0e32\u0e04\u0e19\u0e21\u0e32\u0e01\u0e35\u0e48\u0e04\u0e19 **\u0e17\u0e35\u0e48 \u0e3f0** |\n\n---\n\n## 9. NFR\n### \u0e04\u0e27\u0e32\u0e21\u0e1b\u0e25\u0e2d\u0e14\u0e20\u0e31\u0e22\n- \ud83d\udd12 **\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19 LIFF ID token \u0e1d\u0e31\u0e48\u0e07\u0e40\u0e0b\u0e34\u0e23\u0e4c\u0e1f\u0e40\u0e27\u0e2d\u0e23\u0e4c\u0e40\u0e2a\u0e21\u0e2d** \u2014 \u0e2b\u0e49\u0e32\u0e21\u0e40\u0e0a\u0e37\u0e48\u0e2d userId \u0e08\u0e32\u0e01\u0e40\u0e1a\u0e23\u0e32\u0e27\u0e4c\u0e40\u0e0b\u0e2d\u0e23\u0e4c\n- \ud83d\udd12 LINE access token / channel secret \u0e2d\u0e22\u0e39\u0e48\u0e1d\u0e31\u0e48\u0e07\u0e40\u0e0b\u0e34\u0e23\u0e4c\u0e1f\u0e40\u0e27\u0e2d\u0e23\u0e4c\u0e40\u0e17\u0e48\u0e32\u0e19\u0e31\u0e49\u0e19 (\u0e44\u0e21\u0e48\u0e21\u0e35 `NEXT_PUBLIC_`)\n- \ud83d\udd12 \u0e15\u0e23\u0e27\u0e08 `x-line-signature` \u0e17\u0e38\u0e01 webhook (\u0e21\u0e35\u0e41\u0e25\u0e49\u0e27) \u00b7 \u0e15\u0e2d\u0e1a 200 \u0e40\u0e2a\u0e21\u0e2d\n- \ud83d\udd12 \u0e17\u0e38\u0e01\u0e01\u0e32\u0e23\u0e01\u0e23\u0e30\u0e17\u0e33\u0e17\u0e35\u0e48\u0e21\u0e35\u0e1c\u0e25\u0e20\u0e32\u0e22\u0e19\u0e2d\u0e01 (\u0e2a\u0e48\u0e07\u0e41\u0e04\u0e21\u0e40\u0e1b\u0e0d / \u0e14\u0e36\u0e07\u0e10\u0e32\u0e19 / \u0e25\u0e1a\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25) \u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01 `staff_audit` \u0e27\u0e48\u0e32\u0e43\u0e04\u0e23\u0e17\u0e33\n- \ud83d\udd12 \u0e08\u0e33\u0e01\u0e31\u0e14\u0e2d\u0e31\u0e15\u0e23\u0e32\u0e40\u0e23\u0e35\u0e22\u0e01 API \u0e02\u0e2d\u0e07\u0e40\u0e23\u0e32\u0e40\u0e2d\u0e07 \u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e44\u0e21\u0e48\u0e43\u0e2b\u0e49\u0e42\u0e14\u0e19 LINE \u0e08\u0e33\u0e01\u0e31\u0e14\n\n### PDPA \u2014 \u0e40\u0e2a\u0e49\u0e19\u0e41\u0e14\u0e07\n- **\u0e41\u0e22\u0e01\u0e04\u0e27\u0e32\u0e21\u0e22\u0e34\u0e19\u0e22\u0e2d\u0e21 3 \u0e1b\u0e23\u0e30\u0e40\u0e20\u0e17** (`consents.kind`): \u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e2a\u0e38\u0e02\u0e20\u0e32\u0e1e (\u0e21.26 \u00b7 \u0e15\u0e49\u0e2d\u0e07\u0e0a\u0e31\u0e14\u0e41\u0e08\u0e49\u0e07) / \u0e01\u0e32\u0e23\u0e15\u0e25\u0e32\u0e14 / \u0e01\u0e32\u0e23\u0e23\u0e31\u0e1a\u0e02\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21 LINE\n- \u0e1c\u0e39\u0e49\u0e15\u0e34\u0e14\u0e15\u0e32\u0e21\u0e40\u0e14\u0e34\u0e21 **\u0e22\u0e34\u0e19\u0e22\u0e2d\u0e21\u0e41\u0e04\u0e48\u0e23\u0e31\u0e1a\u0e02\u0e48\u0e32\u0e27\u0e2a\u0e32\u0e23\u0e08\u0e32\u0e01 OA** \u2192 **\u0e2b\u0e49\u0e32\u0e21\u0e1c\u0e39\u0e01\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e2a\u0e38\u0e02\u0e20\u0e32\u0e1e\u0e01\u0e31\u0e1a\u0e40\u0e02\u0e32\u0e08\u0e19\u0e01\u0e27\u0e48\u0e32\u0e08\u0e30\u0e01\u0e14\u0e22\u0e34\u0e19\u0e22\u0e2d\u0e21\u0e40\u0e2d\u0e07**\n- \u0e17\u0e38\u0e01\u0e02\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21\u0e01\u0e32\u0e23\u0e15\u0e25\u0e32\u0e14 **\u0e15\u0e49\u0e2d\u0e07\u0e21\u0e35\u0e17\u0e32\u0e07\u0e16\u0e2d\u0e19** (\u0e1b\u0e38\u0e48\u0e21 postback \"\u0e2b\u0e22\u0e38\u0e14\u0e23\u0e31\u0e1a\u0e02\u0e48\u0e32\u0e27\u0e2a\u0e32\u0e23\") \u2192 \u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01\u0e17\u0e31\u0e19\u0e17\u0e35 + \u0e15\u0e31\u0e14\u0e2d\u0e2d\u0e01\u0e17\u0e38\u0e01 segment\n- **\u0e44\u0e21\u0e48\u0e40\u0e01\u0e47\u0e1a\u0e40\u0e19\u0e37\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21\u0e41\u0e0a\u0e17\u0e42\u0e14\u0e22\u0e04\u0e48\u0e32\u0e40\u0e23\u0e34\u0e48\u0e21\u0e15\u0e49\u0e19** \u2014 \u0e40\u0e01\u0e47\u0e1a\u0e41\u0e04\u0e48 \"\u0e21\u0e35\u0e02\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21\u0e40\u0e02\u0e49\u0e32\u0e21\u0e32\u0e40\u0e21\u0e37\u0e48\u0e2d\u0e44\u0e2b\u0e23\u0e48\" (\u0e40\u0e01\u0e47\u0e1a\u0e40\u0e19\u0e37\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21\u0e15\u0e49\u0e2d\u0e07\u0e40\u0e1b\u0e47\u0e19\u0e01\u0e32\u0e23\u0e15\u0e31\u0e49\u0e07\u0e04\u0e48\u0e32\u0e17\u0e35\u0e48\u0e40\u0e08\u0e49\u0e32\u0e02\u0e2d\u0e07\u0e41\u0e1a\u0e23\u0e19\u0e14\u0e4c\u0e40\u0e1b\u0e34\u0e14\u0e40\u0e2d\u0e07 + \u0e41\u0e08\u0e49\u0e07\u0e43\u0e19\u0e19\u0e42\u0e22\u0e1a\u0e32\u0e22)\n- **\u0e19\u0e42\u0e22\u0e1a\u0e32\u0e22\u0e40\u0e01\u0e47\u0e1a\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25:** \u0e44\u0e21\u0e48\u0e21\u0e35\u0e01\u0e34\u0e08\u0e01\u0e23\u0e23\u0e21 24 \u0e40\u0e14\u0e37\u0e2d\u0e19 \u2192 \u0e17\u0e33\u0e43\u0e2b\u0e49\u0e44\u0e21\u0e48\u0e23\u0e30\u0e1a\u0e38\u0e15\u0e31\u0e27\u0e15\u0e19 (anonymize) \u0e42\u0e14\u0e22\u0e2d\u0e31\u0e15\u0e42\u0e19\u0e21\u0e31\u0e15\u0e34\n- \u0e23\u0e2d\u0e07\u0e23\u0e31\u0e1a\u0e04\u0e33\u0e02\u0e2d\u0e40\u0e08\u0e49\u0e32\u0e02\u0e2d\u0e07\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25 (\u0e02\u0e2d\u0e14\u0e39 / \u0e02\u0e2d\u0e41\u0e01\u0e49 / \u0e02\u0e2d\u0e25\u0e1a) \u0e08\u0e32\u0e01\u0e2b\u0e19\u0e49\u0e32 Customer 360\n- \u0e2d\u0e31\u0e1b\u0e40\u0e14\u0e15 `/privacy` \u0e43\u0e2b\u0e49\u0e04\u0e23\u0e2d\u0e1a\u0e04\u0e25\u0e38\u0e21\u0e01\u0e32\u0e23\u0e43\u0e0a\u0e49\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e40\u0e1e\u0e37\u0e48\u0e2d CRM + \u0e01\u0e32\u0e23\u0e2a\u0e48\u0e07\u0e02\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21\u0e01\u0e32\u0e23\u0e15\u0e25\u0e32\u0e14 \u270d\ufe0f **\u0e15\u0e49\u0e2d\u0e07\u0e43\u0e2b\u0e49\u0e40\u0e08\u0e49\u0e32\u0e02\u0e2d\u0e07\u0e41\u0e1a\u0e23\u0e19\u0e14\u0e4c\u0e15\u0e23\u0e27\u0e08**\n\n### \u0e1b\u0e23\u0e30\u0e2a\u0e34\u0e17\u0e18\u0e34\u0e20\u0e32\u0e1e\n- LIFF connect \u2192 \u0e40\u0e2b\u0e47\u0e19\u0e1c\u0e25\u0e20\u0e32\u0e22\u0e43\u0e19 **2 \u0e27\u0e34\u0e19\u0e32\u0e17\u0e35** (\u0e04\u0e19\u0e2d\u0e22\u0e39\u0e48\u0e1a\u0e19\u0e21\u0e37\u0e2d\u0e16\u0e37\u0e2d 4G)\n- Customer 360 \u0e42\u0e2b\u0e25\u0e14 < 1.5 \u0e27\u0e34\u0e19\u0e32\u0e17\u0e35 (\u0e44\u0e17\u0e21\u0e4c\u0e44\u0e25\u0e19\u0e4c\u0e41\u0e1a\u0e48\u0e07\u0e2b\u0e19\u0e49\u0e32 50 \u0e23\u0e32\u0e22\u0e01\u0e32\u0e23)\n- Backfill / campaign \u0e40\u0e1b\u0e47\u0e19\u0e07\u0e32\u0e19\u0e1e\u0e37\u0e49\u0e19\u0e2b\u0e25\u0e31\u0e07\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14 \u2014 \u0e44\u0e21\u0e48\u0e1a\u0e25\u0e47\u0e2d\u0e01\u0e2b\u0e19\u0e49\u0e32\u0e08\u0e2d\n\n---\n\n## 10. \u0e15\u0e49\u0e19\u0e17\u0e38\u0e19\n> **\u0e2b\u0e25\u0e31\u0e01\u0e01\u0e32\u0e23:** \u0e17\u0e38\u0e01 push/broadcast = \u0e40\u0e07\u0e34\u0e19\u0e08\u0e23\u0e34\u0e07 \u0e15\u0e48\u0e2d\u0e04\u0e19 \u0e15\u0e48\u0e2d\u0e02\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21 \u00b7 reply = \u0e1f\u0e23\u0e35 \u2192 **\u0e2d\u0e2d\u0e01\u0e41\u0e1a\u0e1a\u0e43\u0e2b\u0e49 \"\u0e40\u0e02\u0e32\u0e17\u0e31\u0e01\u0e21\u0e32\" \u0e21\u0e32\u0e01\u0e01\u0e27\u0e48\u0e32 \"\u0e40\u0e23\u0e32\u0e22\u0e34\u0e07\u0e44\u0e1b\"**\n\n### \u0e17\u0e33\u0e44\u0e21\u0e15\u0e49\u0e2d\u0e07\u0e40\u0e02\u0e49\u0e21\u0e02\u0e19\u0e32\u0e14\u0e19\u0e35\u0e49 \u2014 \u0e04\u0e13\u0e34\u0e15\u0e28\u0e32\u0e2a\u0e15\u0e23\u0e4c\u0e02\u0e2d\u0e07\u0e10\u0e32\u0e19 150,000 \u0e04\u0e19\n> \u26a0\ufe0f **\u0e23\u0e32\u0e04\u0e32\u0e15\u0e48\u0e2d\u0e02\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21\u0e43\u0e19\u0e15\u0e32\u0e23\u0e32\u0e07\u0e19\u0e35\u0e49\u0e40\u0e1b\u0e47\u0e19\u0e15\u0e31\u0e27\u0e40\u0e25\u0e02\u0e2a\u0e21\u0e21\u0e15\u0e34\u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e41\u0e2a\u0e14\u0e07\u0e25\u0e33\u0e14\u0e31\u0e1a\u0e04\u0e27\u0e32\u0e21\u0e43\u0e2b\u0e0d\u0e48\u0e40\u0e17\u0e48\u0e32\u0e19\u0e31\u0e49\u0e19 \u0e44\u0e21\u0e48\u0e43\u0e0a\u0e48\u0e23\u0e32\u0e04\u0e32\u0e08\u0e23\u0e34\u0e07\u0e02\u0e2d\u0e07 OA \u0e04\u0e23\u0e39\u0e01\u0e49\u0e2d\u0e22** \u2014 \u0e15\u0e49\u0e2d\u0e07\u0e01\u0e23\u0e2d\u0e01\u0e23\u0e32\u0e04\u0e32\u0e08\u0e23\u0e34\u0e07\u0e08\u0e32\u0e01\u0e41\u0e1e\u0e47\u0e01\u0e40\u0e01\u0e08\u0e02\u0e2d\u0e07
