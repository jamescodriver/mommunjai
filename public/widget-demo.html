<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mommunjai — ตัวอย่างฝัง Widget บนเว็บแบรนด์</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #fff7f3; color: #3d3d4d; }
    .page { max-width: 760px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 20px; }
    code { background: #eee; padding: 2px 6px; border-radius: 6px; }
    .card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 8px 30px rgba(90,60,80,.12); margin: 16px 0; }
    iframe[data-mmj] { width: 100%; border: 0; }
  </style>
</head>
<body>
  <div class="page">
    <h1>ตัวอย่าง: ฝังเครื่องมือ Mommunjai เป็น Widget</h1>
    <p>ก็อปโค้ดนี้ไปวางบนหน้าเว็บ Baby &amp; Mom ได้เลย (เปลี่ยน <code>APP_URL</code> เป็นโดเมนจริง)</p>
    <div class="card">
      <!-- widget: ovulation -->
      <iframe data-mmj src="/tools/ovulation?embed=1" scrolling="no" title="นับวันไข่ตก"></iframe>
    </div>
    <div class="card">
      <!-- widget: protein -->
      <iframe data-mmj src="/tools/protein?embed=1" scrolling="no" title="คำนวณโปรตีน"></iframe>
    </div>
    <script src="/embed.js" async></script>
  </div>
</body>
</html>
